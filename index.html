<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music Book</title>
  <meta name="theme-color" content="#1b1d21">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="library">
    <header class="topbar">
      <h1>Music Book</h1>
      <div class="spacer"></div>
      <button id="upload-btn" type="button" class="primary">+ Add music</button>
      <button id="settings-btn" type="button" title="MIDI &amp; page-turn settings" aria-label="Settings">⚙</button>
    </header>

    <p id="status" hidden></p>

    <div id="empty" hidden>
      <p>Your library is empty.</p>
      <p class="muted">Drop files anywhere on this page, or <button id="empty-upload" type="button" class="link">choose files</button>.<br>
        Supported: <span id="formats"></span></p>
    </div>

    <ul id="grid"></ul>
    <input id="file-input" type="file" multiple hidden>
  </main>

  <div id="viewer" hidden>
    <div class="stage"></div>
    <div class="viewer-title"></div>
    <button class="close" type="button" aria-label="Close music" title="Close (Esc)">×</button>
    <div class="page-indicator"></div>
  </div>

  <dialog id="settings">
    <div class="settings-head">
      <h2>Settings</h2>
      <button class="settings-close" type="button" aria-label="Close settings">×</button>
    </div>
    <div class="settings-body"></div>
  </dialog>

  <div id="drop-hint">Drop to add to library</div>

  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script src="js/namespace.js"></script>
  <script src="js/library.js"></script>
  <script src="js/readers/pdf-reader.js"></script>
  <script src="js/readers/image-reader.js"></script>
  <script src="js/readers/index.js"></script>
  <script src="js/input/midi.js"></script>
  <script src="js/input/bindings.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/settings-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
